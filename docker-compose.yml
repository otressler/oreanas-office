# Local development services. scripts/dev.ps1 starts them, or `docker compose up -d`.
# The `app` profile runs the production container against the same services,
# for smoke tests: `docker compose --profile app up --build`.
# The `phone` profile adds Traefik with a Let's Encrypt certificate for phone tests
# on the home network: `pwsh scripts/phone.ps1`.
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Local_Dev_Only_1"
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0 --loose --skipApiVersionCheck
    ports:
      - "10000:10000"
    volumes:
      - azurite-data:/data

  app:
    profiles: [app]
    build:
      context: .
      # From .env (never commit). Without them the Impressum says its details are missing.
      args:
        IMPRINT_NAME: ${IMPRINT_NAME:-}
        IMPRINT_STREET: ${IMPRINT_STREET:-}
        IMPRINT_CITY: ${IMPRINT_CITY:-}
        IMPRINT_EMAIL: ${IMPRINT_EMAIL:-}
    depends_on: [sql, azurite]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: "Server=sql,1433;Database=OreanasOffice;User Id=sa;Password=Local_Dev_Only_1;TrustServerCertificate=True"
      ConnectionStrings__Storage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      # From .env (never commit). Without them Google sign-in is off and nobody is admin.
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Admin__Email: ${ADMIN_EMAIL:-}
      # The Foundry image deployment; without it generating backgrounds is off.
      Images__Endpoint: ${AZURE_OPENAI_ENDPOINT:-}
      Images__ApiKey: ${AZURE_API_KEY:-}
      Images__Deployment: ${AZURE_IMAGE_DEPLOYMENT:-}
    ports:
      - "8080:8080"

  traefik:
    profiles: [phone]
    image: traefik:v3
    depends_on: [app]
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --entrypoints.websecure.address=:443
      # DNS challenge: the laptop isn't reachable from the internet, so Let's
      # Encrypt checks a TXT record that Traefik creates through the INWX API.
      - --certificatesresolvers.inwx.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.inwx.acme.dnschallenge=true
      - --certificatesresolvers.inwx.acme.dnschallenge.provider=inwx
    environment:
      # From .env (never commit). INWX_SHARED_SECRET only if the account uses 2FA.
      INWX_USERNAME: ${INWX_USERNAME:-}
      INWX_PASSWORD: ${INWX_PASSWORD:-}
      INWX_SHARED_SECRET: ${INWX_SHARED_SECRET:-}
    # Public resolvers, so the DNS challenge sees the TXT record and not a cached
    # answer from the router.
    dns: [1.1.1.1, 8.8.8.8]
    ports:
      - "443:443"
    volumes:
      - ./docker/traefik:/etc/traefik/dynamic:ro
      - traefik-acme:/letsencrypt

volumes:
  sql-data:
  azurite-data:
  traefik-acme:
